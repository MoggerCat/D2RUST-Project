[package]
name = "d2-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# cargo-fuzz crate: not a member of the main workspace (needs nightly).
# Run from this directory: `cargo +nightly fuzz run <target>`.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
d2-formats = { path = "../crates/d2-formats", features = ["fuzz", "test-support"] }
d2-data = { path = "../crates/d2-data" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "mkseeds"
path = "src/mkseeds.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dc6"
path = "fuzz_targets/dc6.rs"
test = false
doc = false
bench = false

