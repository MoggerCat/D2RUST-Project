[package]
name = "d2-client"
description = "Bevy client: rendering, input, UI, audio, and the bridge to the server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The only crate allowed to depend on Bevy (enforced by tools/depcheck).
bevy.workspace = true
d2-formats.workspace = true
d2-native.workspace = true
d2-proto.workspace = true
d2-net.workspace = true
# The in-process server of single player (`bridge::local`). Never the
# reverse (tools/depcheck).
d2-server.workspace = true
# The app's single-player game (`app::single_player`): the wired sim and
# the user's own tables. Game logic stays in d2-sim; the app only builds
# and stages it, as the server tests do.
d2-sim.workspace = true
d2-data.workspace = true
d2-verify.workspace = true
# `state-dump --send` (`bridge::inject`, `app::send`): the scenario
# scripts' message parser, encoder and references (`specs/tools/scenario.md`
# §3), shared with `tools/scenario-run`. Its dependencies are all above.
conformance.workspace = true
thiserror.workspace = true
anyhow.workspace = true
# PNG output for the CPU reference renderer and verification images. Same
# version Bevy already uses, so no extra copy is built.
image = { version = "0.25", default-features = false, features = ["png"] }
# 1.14d frame captures (`verify::capture`, `specs/render/capture.md` §5–§6):
# the palettized PNGs are read raw (indices, PLTE) with the png crate the
# image crate already builds; the raw format is JSON lines; hashes are
# SHA-256. No new crate is downloaded.
png = "0.18"
sha2.workspace = true
serde_json.workspace = true
# Controls file parser (`specs/client/ui.md` §A6): same toml_edit Bevy's
# macros already build, so no new crate is downloaded.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
# GPU compute compositor (`specs/client/render-pipeline.md` §A9): the wgpu
# Bevy already builds (same version and backends), used directly so the
# compositor runs headless for verify; `wgpu::naga` validates its WGSL in CI.
wgpu = { version = "29.0.3", default-features = false, features = ["wgsl", "dx12", "metal", "vulkan", "naga-ir"] }

[features]
# `state-dump --rng FILE`: the RNG draw log of d2-sim
# (`specs/tools/rng-trace.md`); off in every normal build.
rng-trace = ["d2-sim/rng-trace"]
# Behaviour coverage counters of d2-sim (tools/coverage-map); off in every
# normal build.
coverage-map = ["d2-sim/coverage-map"]

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
# The local-server end-to-end test builds a wired sim from synthetic tables
# (its combat / missile tables are the shared `bench_fixtures::combat`).
d2-sim = { workspace = true, features = ["bench-fixtures"] }
d2-data.workspace = true
# The play-on-native test (tests/play_native.rs) converts a synthetic
# install with d2-convert and loads it on both sources.
d2-convert = { path = "../../tools/d2-convert" }
# The far-act join test (tests/app_single_player.rs) makes its saves with
# d2s-tool on the user's tables.
d2s-tool = { path = "../../tools/d2s-tool" }
test-fixtures.workspace = true

[lints]
workspace = true

[[bench]]
name = "compose"
harness = false
