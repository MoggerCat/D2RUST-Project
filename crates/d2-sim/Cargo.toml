[package]
name = "d2-sim"
description = "Deterministic D2 game simulation. No I/O, no rendering, no Bevy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
d2-data.workspace = true

# Cargo can't extend workspace lints, so this repeats them with additions.
# Keep in sync with [workspace.lints] in the root Cargo.toml.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Determinism (CLAUDE.md rule 6): no floats in game logic.
float_arithmetic = "deny"
