[package]
name = "d2-sim"
description = "Deterministic D2 game simulation. No I/O, no rendering, no Bevy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
d2-data.workspace = true
d2-formats.workspace = true
thiserror.workspace = true

# Cargo can't extend workspace lints, so this repeats them with additions.
# Keep in sync with [workspace.lints] in the root Cargo.toml.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Determinism (CLAUDE.md rule 6): no floats in game logic.
float_arithmetic = "deny"


[dev-dependencies]
criterion.workspace = true
# The benches reuse the unit tests' synthetic fixtures (`bench_fixtures`).
d2-sim = { path = ".", features = ["bench-fixtures"] }

[[bench]]
name = "sim"
harness = false

[features]
# Exposes the synthetic fixtures of the unit tests to `benches/` (criterion);
# never enabled in a normal build.
bench-fixtures = []
