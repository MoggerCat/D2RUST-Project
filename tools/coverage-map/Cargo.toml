[package]
name = "coverage-map"
description = "Behaviour coverage counters for d2-sim (feature `coverage-map`, off by default): which skills, monsters, AI functions, objects, items, NPC topics, quest steps, levels, missiles and states a run exercised."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No dependencies: d2-sim pulls this crate in only with its `coverage-map`
# feature; the counters copy ids and never feed back into the game.

[lints]
workspace = true
