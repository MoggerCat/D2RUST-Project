name: CI

# Branch pushes are covered by their pull request; this saves Actions minutes.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # CI has no game files: tests that need them are #[ignore] and read D2_GAME_DIR.
  # Parser/property tests keep their in-source default case counts (<1 s);
  # PROPTEST_CASES is deliberately unset (it would override every default).
  # Shrinking is bounded so a failing property cannot stall a job.
  PROPTEST_MAX_SHRINK_TIME: "10000"
  # Deep runs (20000 cases, the wired-game property) are in nightly-props.yml,
  # outside the `check` below; locally: `sh tools/props-deep.sh`.

# A newer push to the same PR/branch supersedes the running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Same steps, same order, as `sh tools/gate.sh`; the jobs run in parallel.
jobs:
  # Python checkers, hook check, fmt, dependency + determinism rules.
  # No Bevy libraries needed.
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Spec section indexes
        run: python3 tools/spec_index.py --check

      - name: Methods collection
        run: python3 tools/methods.py check

      # Claims of spec rules by tests (docs/COVERAGE.md): fails on a dangling
      # claim, never on low coverage; the selftest holds its perturbations.
      - name: Spec rule claims
        run: |
          python3 tools/coverage.py --check
          python3 tools/coverage.py --selftest

      # The tick traces (specs/sim/tick.md) replay through the spec model;
      # the checkers' selftests include their perturbations (METHODS M08).
      - name: Trace checkers
        run: |
          python3 tools/trace-recorder/check_tick.py --selftest
          python3 tools/trace-recorder/convert_tick.py --selftest
          python3 tools/trace-recorder/convert_tick.py --check traces/sim/tick/*.json
          python3 tools/trace-recorder/check_rooms.py --selftest
          python3 tools/trace-recorder/check_rooms.py traces/sim/tick/*.json

      # CLAUDE.md hard rule 1: the pre-commit hook's patterns, tested in a
      # scratch repo and applied to every tracked file.
      - name: Blizzard-file check
        run: sh tools/hooks/selftest.sh

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tools

      - name: Format
        run: cargo fmt --all -- --check

      # Crate dependency rules and the d2-sim determinism lint (rule 6).
      - name: Dependency rules
        run: cargo run -p depcheck

  clippy-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-core
      # --all-targets also compiles tests, benches and examples.
      - name: Clippy (all but d2-client)
        run: cargo clippy --workspace --exclude d2-client --all-targets -- -D warnings

  test-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-sim
      # nextest selects the same tests as `cargo test` (ignored ones stay
      # skipped); doc-tests are not run by nextest, so they run separately.
      - uses: taiki-e/install-action@nextest
      - name: Test d2-sim + conformance
        run: cargo nextest run --no-tests=pass -p d2-sim -p conformance
      - name: Doc-tests
        run: cargo test --doc -p d2-sim -p conformance

  test-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-rest
      - uses: taiki-e/install-action@nextest
      - name: Test (all but d2-sim, conformance, d2-client)
        run: cargo nextest run --no-tests=pass --workspace --exclude d2-sim --exclude conformance --exclude d2-client
      - name: Doc-tests
        run: cargo test --doc --workspace --exclude d2-sim --exclude conformance --exclude d2-client

  # The Bevy crate: the long pole on a cold cache, so it has its own job.
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bevy's native dependencies (audio, input, windowing) on Linux.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: client

      - uses: taiki-e/install-action@nextest

      - name: Clippy d2-client
        run: cargo clippy -p d2-client --all-targets -- -D warnings

      - name: Test d2-client
        run: cargo nextest run --no-tests=pass -p d2-client

      - name: Doc-tests
        run: cargo test --doc -p d2-client

  # Branch protection on main requires a status named `check` (the single
  # job before the split). This job keeps that name and passes only when
  # every job above passed.
  check:
    if: always()
    needs: [tools, clippy-core, test-sim, test-rest, client]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          test "${{ needs.tools.result }}" = success
          test "${{ needs.clippy-core.result }}" = success
          test "${{ needs.test-sim.result }}" = success
          test "${{ needs.test-rest.result }}" = success
          test "${{ needs.client.result }}" = success
